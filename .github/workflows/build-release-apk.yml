name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.1.0 or existing tag)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi
          if [ -d "/usr/local/lib/android/sdk/platform-tools" ]; then
            echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          fi

      - name: Accept Android SDK Licenses and Install Missing Packages
        run: |
          if [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDK_MANAGER="sdkmanager"
          else
            SDK_MANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f -perm /111 2>/dev/null | head -n 1)
          fi

          echo "Using sdkmanager at: $SDK_MANAGER"

          yes | "$SDK_MANAGER" --licenses || true
          yes | "$SDK_MANAGER" "platforms;android-36" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Signing Keystore
        run: |
          if [ ! -f "./debug.keystore" ] && [ -f "./debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ ! -f "./debug.keystore" ]; then
            echo "Generating signing keystore for build..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Release,O=AIStudio,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          test -f "./debug.keystore" && echo "Keystore ready: $(ls -lh ./debug.keystore)"

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release APK Output
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK file not found at $APK_PATH" >&2
            echo "Searching for generated APKs:"
            find app/build/outputs/ -type f -name "*.apk"
            exit 1
          fi
          echo "Verified APK successfully generated at: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Prepare Release Asset File
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          # Copy APK to the exact target release asset name
          cp "$APK_SOURCE" ./ERAN-MONEY-APK.apk
          echo "Release asset prepared:"
          ls -lh ./ERAN-MONEY-APK.apk

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERAN-MONEY-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v1.1.0' }}
          name: "EmaanMani v1.1.0"
          body: |
            EmaanMani v1.1.0

            - Updated application version to 1.1.0
            - Updated current application files
            - Preserved existing game/application functionality

            ### ⬇️ Direct Release APK Download
            Direct APK file attached below under **Assets**:
            - **ERAN-MONEY-APK.apk**
          draft: false
          prerelease: false
          files: |
            ./ERAN-MONEY-APK.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
